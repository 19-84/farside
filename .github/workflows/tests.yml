on: [push, pull_request]
name: Tests
jobs:
  test:
    strategy:
      matrix:
        # go.mod requires go >= 1.23.4, and setup-go@v6 defaults to
        # GOTOOLCHAIN=local, so older toolchains genuinely cannot build this
        # module. Under setup-go@v5 the 1.21/1.22 cells silently downloaded
        # 1.23.4 and tested that instead -- they never exercised 1.21/1.22.
        go-version: ['1.23.x', 'stable']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
    - name: Check formatting
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23.x'
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi
    - name: Test
      run: go test -v ./...

