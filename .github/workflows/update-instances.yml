on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update-instances:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get install -y jq dnsutils
        sudo curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
        sudo chmod a+rx /usr/local/bin/yq

    - name: Fetch instances
      run: |
        function apply_update() {
          # Never let an empty upstream list wipe a service that currently has
          # instances. searx.space stopped populating .generator, which made the
          # SearXNG filter select nothing and silently zeroed the service until
          # someone noticed. A source that changes schema or goes down should
          # leave the previous list in place -- dead entries get pruned by the
          # runtime health check anyway, whereas an empty list takes the whole
          # service offline.
          jq -s '
            (.[0] | map({key: .type, value: (.instances // [])}) | from_entries) as $old |
            .[1] | map(
              if ((.instances // []) | length) == 0
                 and (($old[.type] // []) | length) > 0
              then . + {instances: $old[.type]}
              else . end
            )
          ' services-full.json services-tmp.json > services-guarded.json

          jq -s -r '
            (.[1] | map({key: .type, value: ((.instances // []) | length)}) | from_entries) as $kept |
            .[0][]
            | select(((.instances // []) | length) == 0)
            | select(($kept[.type] // 0) > 0)
            | "::warning::\(.type): upstream list came back empty; kept \($kept[.type]) existing instances"
          ' services-tmp.json services-guarded.json

          mv services-guarded.json services-full.json
          rm -f *-tmp.json

          # Ensure no trailing slashes on instance and fallback URLs.
          # This was 'sed -i s|/"|"|g', which rewrote a / before ANY quote in
          # the file -- including "test_url": "/" (SearXNG's), silently turning
          # it into "". Target the URL fields explicitly instead.
          jq '
            map(
              .instances = ((.instances // []) | map(sub("/+$"; "")))
              | if has("fallback") then .fallback = (.fallback | sub("/+$"; "")) else . end
            )
          ' services-full.json > services-slashes.json
          mv services-slashes.json services-full.json
        }

        # LibRedirect keeps a curated, actively-maintained registry covering
        # most of the frontends farside redirects to. Several services have no
        # upstream registry of their own (or theirs has died, as Tent's did),
        # so this is their instance source. Fetched once and reused.
        #   libredirect_update <farside type> <libredirect key>
        # A registry that is down or starts serving HTML (an error page, a
        # bot wall) makes its jq exit non-zero, and under `bash -e` that
        # aborted the whole run -- so one dead registry blocked every other
        # service's update and the prune. Each fetch below ends in
        # `|| registry_failed <name> <file>`: warn, write an empty list, and
        # let apply_update keep that service's existing instances.
        function registry_failed() {
          echo "::warning::$1: registry fetch failed or returned invalid JSON; keeping existing instances"
          echo '[]' > "$2"
        }

        function libredirect_update() {
          local type="$1" key="$2"
          shift 2
          # Any further args are working instances LibRedirect doesn't track.
          # They are re-added every night but still go through prune.py, whose
          # persisted strikes drop them again at once if they die.
          jq --arg k "$key" '[.[$k].clearnet[]?] + $ARGS.positional | unique' \
            libredirect.json --args "$@" \
            > "$type-tmp.json" || registry_failed "$type (libredirect)" "$type-tmp.json"

          jq --slurpfile new "$type-tmp.json" --arg t "$type" \
            '(.[] | select(.type == $t)).instances |= $new[0]' \
            services-full.json > services-tmp.json

          apply_update
        }

        curl -sf --max-time 60 https://raw.githubusercontent.com/libredirect/instances/main/data.json \
          > libredirect.json || true
        jq -e 'type == "object"' libredirect.json >/dev/null 2>&1 || echo '{}' > libredirect.json

        # ==============================================================
        # Git config
        # ==============================================================
        git config --global user.name github-actions
        git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
        git checkout main

        # ==============================================================
        # Bibliogram update
        # NOTE: Bibliogram has been discontinued and the official instance
        # at bibliogram.art is no longer around. Unless a new "official"
        # instance pops up, Bibliogram will likely be removed from farside
        # ==============================================================
        #curl -s https://bibliogram.art/api/instances | \
          #jq '[
            #.data |
            #.[] |
            #select(.onion_site | not) |
            #.address
          #] | sort' > bibliogram-tmp.json
        #jq --slurpfile bibliogram bibliogram-tmp.json \
          #'( .[] | select(.type == "bibliogram") )
          #.instances |= $bibliogram[0]' services-full.json > services-tmp.json

        #apply_update

        # ==============================================================
        # SearXNG update
        # ==============================================================
        curl -sf --max-time 60 https://searx.space/data/instances.json | \
          jq '[
            .instances |
            to_entries[] |
            select(.value.network_type == "normal") |
            # searx.space stopped populating .generator in Aug 2026 (it is now
            # null for every instance), so filtering on it selected nothing and
            # silently zeroed this service. searx.space only tracks SearXNG
            # these days, so .version being present is the check that matters.
            select(.value.version | . != null) |
            select(.value.network.asn_privacy == 0) |
            select(.value.http.error == null) |
            select(.value.uptime.uptimeDay >= 99) |
            select(.value.tls.grade == "A+" or .value.tls.grade == "A") |
            select(.value.http.grade == "A+" or .value.http.grade == "A") |
            select(.value.html.grade == "V" or .value.html.grade == "F") |
            select(.key | contains(".i2p") | not) |
            .key
          ] | sort' > searxng-tmp.json || registry_failed searxng searxng-tmp.json

        cat searxng-tmp.json | jq .

        jq --slurpfile searxng searxng-tmp.json \
          '( .[] | select(.type == "searxng") )
          .instances |= $searxng[0]' services-full.json > services-tmp.json

        apply_update

        # ==============================================================
        # Nitter update
        #
        # zedeus/nitter was archived after X's Aug 2026 cease-and-desist, and
        # its wiki instance list (which LibRedirect scrapes) went stale. Union
        # two live sources: status.d420.de's health-checked hosts, and the
        # instances.json of the active successor fork (codeberg mv12star/shitter).
        # The fork's list also carries meta-redirectors that bounce to other
        # instances (twiiit, twit.0r.cx) and bitter.st, which is private: it
        # redirects to /login with a 200 that passes the health check, while
        # browsers get a 502. Drop those; dead entries are left to prune.py.
        # Either source may fail on its own without emptying the list.
        # ==============================================================
        curl -sf --max-time 60 https://status.d420.de/api/v1/instances | \
          jq '[.hosts | to_entries[] | select(.value.healthy == true) | .value.url]' \
          > nitter-d420.json || registry_failed "nitter (d420)" nitter-d420.json
        curl -sf --max-time 60 https://codeberg.org/mv12star/shitter/raw/branch/master/instances.json | \
          jq '[.[] | .url | select(type == "string")]' \
          > nitter-shitter.json || registry_failed "nitter (shitter)" nitter-shitter.json

        jq -s '[.[][] | rtrimstr("/")] - ["https://twiiit.com", "https://twit.0r.cx", "https://bitter.st"] | unique' \
          nitter-d420.json nitter-shitter.json > nitter-tmp.json
        rm -f nitter-d420.json nitter-shitter.json

        jq --slurpfile nitter nitter-tmp.json \
          '( .[] | select(.type == "nitter") )
          .instances |= $nitter[0]' services-full.json > services-tmp.json

        apply_update

        # ==============================================================
        # SimplyTranslate update
        # ==============================================================
        curl -sf --max-time 60 https://codeberg.org/SimpleWeb/Website/raw/branch/master/config.json | jq -r '.projects | map(select(.id == "simplytranslate"))[0].instances | .[]' > st-out || : > st-out
        sed -i -e 's/^/https:\/\//' st-out
        jq -ncR '[inputs | select(length > 0)]' <<< "$(sort st-out)" > st-tmp.json

        jq --slurpfile simplytranslate st-tmp.json \
          '( .[] | select(.type == "simplytranslate") )
          .instances |= $simplytranslate[0]' services-full.json > services-tmp.json

        apply_update

        # ==============================================================
        # Invidious update
        # ==============================================================
        curl -sf --max-time 60 https://api.invidious.io/instances.json | \
          jq '[
            .[] |
            select(.[1].type | contains("https")) ] |
            [.[][1].uri] |
            sort' > invidious-tmp.json || registry_failed invidious invidious-tmp.json
        jq --slurpfile invidious invidious-tmp.json \
          '( .[] | select(.type == "invidious") )
          .instances |= $invidious[0]' services-full.json > services-tmp.json

        apply_update

        # ==============================================================
        # Scribe update
        # ==============================================================
        curl -sf --max-time 60 https://git.sr.ht/~edwardloveall/scribe/blob/main/docs/instances.json > scribe-tmp.json || true
        jq -e 'type == "array"' scribe-tmp.json >/dev/null 2>&1 || registry_failed scribe scribe-tmp.json
        jq --slurpfile scribe scribe-tmp.json \
          '( .[] | select(.type == "scribe") )
          .instances |= $scribe[0]' services-full.json > services-tmp.json

        apply_update

        # ==============================================================
        # teddit update
        # Note: no longer maintained
        # ==============================================================
        #curl -s https://codeberg.org/teddit/teddit/raw/branch/main/instances.json | \
          #jq '[
            #.[] |
            #select(.url | contains("https")) |
            #.url ] |
            #sort' > teddit-tmp.json
        #jq --slurpfile teddit teddit-tmp.json \
          #'( .[] | select(.type == "teddit") )
          #.instances |= $teddit[0]' services-full.json > services-tmp.json

        #apply_update

        # ==============================================================
        # libreddit + redlib update
        # ==============================================================
        curl -sf --max-time 60 https://raw.githubusercontent.com/redlib-org/redlib-instances/main/instances.json | \
          jq '[
            .instances[] |
            select(.url) |
            .url ] |
            sort' > libreddit-tmp.json || registry_failed libreddit libreddit-tmp.json

        jq --slurpfile libreddit libreddit-tmp.json \
          '( .[] | select(.type == "libreddit") )
          .instances |= $libreddit[0]' services-full.json > services-tmp.json

        mv services-tmp.json services-full.json

        jq --slurpfile redlib libreddit-tmp.json \
          '( .[] | select(.type == "redlib") )
          .instances |= $redlib[0]' services-full.json > services-tmp.json

        apply_update

        # ==============================================================
        # BreezeWiki update
        # ==============================================================
        curl -sf --max-time 60 https://docs.breezewiki.com/files/instances.json | \
          jq '[.[] | .instance]' > breezewiki-tmp.json || registry_failed breezewiki breezewiki-tmp.json
        jq --slurpfile breezewiki breezewiki-tmp.json \
          '(.[] | select(.type == "breezewiki") )
          .instances |= $breezewiki[0]' services-full.json > services-tmp.json

        apply_update

        # ==============================================================
        # GotHub update
        # ==============================================================

        curl -sf --max-time 60 https://codeberg.org/gothub/gothub-instances/raw/branch/master/instances.json | \
          jq '[.[] | .link]' > gothub-tmp.json || registry_failed gothub gothub-tmp.json
        jq --slurpfile gothub gothub-tmp.json \
          '(.[] | select(.type == "gothub") )
          .instances |= $gothub[0]' services-full.json > services-tmp.json

          apply_update

        # ==============================================================
        # Rimgo update
        # ==============================================================

        curl -sf --max-time 60 https://rimgo.codeberg.page/api.json | \
          jq '[
            .clearnet[] |
            .url] |
            sort' > rimgo-tmp.json || registry_failed rimgo rimgo-tmp.json

        jq --slurpfile rimgo rimgo-tmp.json \
          '(.[] | select(.type == "rimgo") )
          .instances |= $rimgo[0]' services-full.json > services-tmp.json

          apply_update

        # ==============================================================
        # Tent update
        # ==============================================================

        # Tent's own registry lived on forgejo.sny.sh, which is gone (the host
        # does not resolve/connect at all), so that source silently produced an
        # empty list.
        libredirect_update tent tent

        # ==============================================================
        # Mozhi update (translate frontend; clean JSON registry)
        # Tor/I2P-only entries have no "link" key -> skip them
        # ==============================================================
        curl -sf --max-time 60 https://codeberg.org/aryak/mozhi/raw/branch/master/instances.json | \
          jq '[.[] | .link // empty]' > mozhi-tmp.json || registry_failed mozhi mozhi-tmp.json
        jq --slurpfile mozhi mozhi-tmp.json \
          '( .[] | select(.type == "mozhi") )
          .instances |= $mozhi[0]' services-full.json > services-tmp.json
        apply_update

        # ==============================================================
        # Services with no registry of their own. These were static lists that
        # nothing refreshed, and had drifted far below what LibRedirect tracks
        # (e.g. quetre 2 vs 22, anonymousoverflow 4 vs 34). This must run
        # before prune.py: it replaces each list wholesale, so running it
        # afterwards re-added every instance prune had just removed.
        # ==============================================================
        libredirect_update lingva            lingva
        libredirect_update quetre            quetre
        # libremdb.r4fo.com: the only instance serving title pages (2026-09-30)
        libredirect_update libremdb          libremdb          https://libremdb.r4fo.com
        libredirect_update dumb              dumb
        libredirect_update biblioreads       biblioReads
        libredirect_update anonymousoverflow anonymousOverflow

        rm -f libredirect.json

        # ==============================================================
        # Verify-first discovery for services that only publish their
        # instances in a README/wiki/HTML page (no machine-readable
        # registry). discover.py confirms each candidate is live AND is
        # genuinely that frontend (home-page identity marker) before
        # accepting it, so badge/dependency links are rejected. It prints
        # {type: [instances]} as its last stdout line.
        #
        # The merge is additive (union): the runtime health check prunes
        # dead entries, so a transient discovery failure here never shrinks
        # a list.
        # ==============================================================
        python3 tools/discover.py > discover.log 2>&1 || true
        cat discover.log
        tail -1 discover.log > discovered-tmp.json
        if ! jq -e . discovered-tmp.json >/dev/null 2>&1; then echo '{}' > discovered-tmp.json; fi
        jq --slurpfile disc discovered-tmp.json '
          ($disc[0] // {}) as $d
          | map(.instances = ((.instances + ($d[.type] // [])) | unique))
        ' services-full.json > services-tmp.json
        apply_update
        rm -f discover.log

        # ==============================================================
        # Prune instances dead for >= 3 consecutive runs. Non-flaky:
        # in-run retries plus a persisted per-instance strike counter
        # (instance-strikes.json) -- a transient outage costs a strike, not
        # an immediate removal, and a live probe resets it to 0. Runs after
        # every list refresh (registries, LibRedirect, discovery), so it has
        # the last word on what gets committed. Strikes persist after removal,
        # so a registry re-listing a known-dead instance doesn't bring it back.
        # ==============================================================
        python3 tools/prune.py --file services-full.json --state instance-strikes.json --threshold 3

        # ==============================================================
        # Validate discovery registries (non-blocking). Surfaces a dead or
        # changed upstream registry (e.g. scribe) in the job log instead of
        # silently shipping stale lists. Does not fail the job, since some
        # breakage (scribe) is permanent and should not block all updates.
        # ==============================================================
        python3 tools/check-registries.py || echo "[WARN] one or more registries are dead/broken (see above)"

        # ==============================================================
        # Filter out Cloudflared instances from services-full.json into
        # services.json
        # ==============================================================
        ./tools/un-cloudflare.sh

        # ==============================================================
        # Push changes
        # ==============================================================
        git add services.json services-full.json instance-strikes.json
        git commit -m '[CI] Auto update instances' || exit 0
        git push
